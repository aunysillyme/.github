name: Bug report
description: Report a problem with the smallest steps that reproduce it.
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Describe the problem and any output you saw. Remove credentials and private details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe the result you expected to see.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, device or environment
      description: Include the project version and the device, browser, operating system or other environment involved.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional supporting evidence. Remove credentials and private details before sharing.

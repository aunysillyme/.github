# repo-build-skill@0.1.4 ships an older scripts/check-set.mjs than some set repos.
# Set repository variable SET_SYNC_ENABLED to true only after the hardened checker
# is released, the pin below is updated, and Auny gives the go-ahead.
name: Set sync

on:
  push:
    branches: [main]
    paths: [set.json, set-sync.targets.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: set-sync
  cancel-in-progress: false

jobs:
  targets:
    if: github.ref == 'refs/heads/main' && vars.SET_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      source_sha256: ${{ steps.list.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: Validate set and build target list
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync('set.json');
          const set = JSON.parse(bytes);
          const extras = JSON.parse(fs.readFileSync('set-sync.targets.json', 'utf8'));
          const repo = /^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,99})$/;
          if (!set || set.version !== 1 || !Array.isArray(set.rows) || !set.rows.length) throw Error('Expected version 1 and a nonempty rows array');
          const names = new Set();
          const targets = [];
          for (const row of set.rows) {
            if (!row || !['name', 'url', 'line'].every(k => typeof row[k] === 'string' && row[k].trim() && !/[\r\n]/.test(row[k]))) throw Error('Each row needs nonempty single-line name, url and line');
            if (!repo.test(row.name) || row.url !== `https://github.com/aunysillyme/${row.name}` || row.line.includes('<!--')) throw Error(`Invalid set row: ${row.name}`);
            const key = row.name.toLowerCase();
            if (names.has(key)) throw Error(`Duplicate set row: ${row.name}`);
            names.add(key);
            targets.push({ target: `aunysillyme/${row.name}`, kind: 'set' });
          }
          if (!Array.isArray(extras)) throw Error('Extra targets must be an array');
          for (const target of extras) {
            if (typeof target !== 'string' || !target.startsWith('aunysillyme/') || !repo.test(target.slice('aunysillyme/'.length))) throw Error(`Invalid extra target: ${target}`);
            const key = target.slice('aunysillyme/'.length).toLowerCase();
            if (names.has(key)) throw Error(`Duplicate target: ${target}`);
            names.add(key);
            targets.push({ target, kind: 'extra' });
          }
          const include = targets.map(item => ({ ...item, name: item.target.slice('aunysillyme/'.length) }));
          if (include.length > 256) throw Error('Target list exceeds the GitHub Actions matrix limit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\nsource_sha256=${crypto.createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE

  sync:
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      # Update the version and integrity together.
      SET_SYNC_VERSION: '0.1.4'
      SET_SYNC_INTEGRITY: 'sha512-RXkMDXXViaTwWI3xjFlXLHtUnOXOsKjrPQy3rHkgHqYDWd+CIozUVi3vTC2frqpErDnBIghRfXvmhG8E/8ibFA=='
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.target }}
          ref: main
          path: target
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned sync tool
        if: matrix.kind == 'set'
        working-directory: ${{ runner.temp }}
        run: |
          tarball=$(env -i PATH="$PATH" HOME="$RUNNER_TEMP" npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null npm pack --ignore-scripts --silent "repo-build-skill@$SET_SYNC_VERSION")
          actual=$(node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); process.stdout.write('sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")
          [ "$actual" = "$SET_SYNC_INTEGRITY" ] || { echo 'Sync tool integrity mismatch' >&2; exit 1; }
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null npm install --ignore-scripts --no-audit --no-fund --no-package-lock "./$tarball"
      - name: Sync and verify set repository
        if: matrix.kind == 'set'
        working-directory: target
        env:
          EXPECTED_SHA256: ${{ needs.targets.outputs.source_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['.repo-build/config.json', 'README.md', 'llms.txt']) {
            if (!fs.existsSync(file)) throw Error(`Set sync requires existing input: ${file}`);
          }
          if (!fs.existsSync('.repo-build/facts.json') && !fs.existsSync('package.json')) throw Error('Set sync requires .repo-build/facts.json or package.json');
          const config = JSON.parse(fs.readFileSync('.repo-build/config.json', 'utf8'));
          if (config.set?.source !== 'https://raw.githubusercontent.com/aunysillyme/.github/main/set.json') throw Error('Set source must point to the canonical main set.json');
          NODE
          if [ -f .repo-build/set.lock.json ]; then cp .repo-build/set.lock.json "$RUNNER_TEMP/previous-set-lock.json"; fi
          # CI is cleared intentionally: syncSet's maintainer-only guard permits this sanctioned automation.
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" RUNNER_TEMP="$RUNNER_TEMP" EXPECTED_SHA256="$EXPECTED_SHA256" GITHUB_TOKEN="$GITHUB_TOKEN" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const source = 'https://raw.githubusercontent.com/aunysillyme/.github/main/set.json';
          const bytes = readFileSync('../source/set.json');
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA256) throw Error('Source set does not match validated set.json');
          const fetchImpl = (url, ...options) => url === source
            ? Promise.resolve(new Response(bytes, { status: 200 }))
            : globalThis.fetch(url, ...options);
          const { syncSet } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/node_modules/repo-build-skill/src/set.mjs`).href);
          const result = await syncSet({ root: process.cwd(), fetchImpl });
          console.log(result.message);
          process.exitCode = result.code;
          NODE
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = '.repo-build/set.lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          if (lock.source !== 'https://raw.githubusercontent.com/aunysillyme/.github/main/set.json' || lock.sha256 !== process.env.EXPECTED_SHA256) throw Error('Fetched set does not match this run; retry from main');
          const previousPath = `${process.env.RUNNER_TEMP}/previous-set-lock.json`;
          if (fs.existsSync(previousPath)) {
            const previous = JSON.parse(fs.readFileSync(previousPath, 'utf8'));
            const withoutDate = value => Object.fromEntries(Object.entries(value).filter(([key]) => key !== 'fetched'));
            if (JSON.stringify(withoutDate(previous)) === JSON.stringify(withoutDate(lock))) fs.writeFileSync(lockPath, JSON.stringify(previous, null, 2) + '\n');
          }
          NODE
      - name: Copy set data for extra target
        if: matrix.kind == 'extra'
        working-directory: target
        env:
          EXPECTED_SHA256: ${{ needs.targets.outputs.source_sha256 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync('../source/set.json');
          if (crypto.createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA256) throw Error('Source set does not match validated set.json');
          const dir = '.repo-build';
          const stat = fs.lstatSync(dir, { throwIfNoEntry: false });
          if (stat && (!stat.isDirectory() || stat.isSymbolicLink())) throw Error('Expected a real .repo-build directory');
          fs.mkdirSync(dir, { recursive: true });
          const dest = `${dir}/set.json`;
          const file = fs.lstatSync(dest, { throwIfNoEntry: false });
          if (file && !file.isFile()) throw Error('Expected a regular .repo-build/set.json');
          fs.writeFileSync(dest, bytes);
          NODE
      - name: Stage changes
        id: stage
        working-directory: target
        env:
          KIND: ${{ matrix.kind }}
          EXPECTED_SHA256: ${{ needs.targets.outputs.source_sha256 }}
        run: |
          set -o pipefail
          if [ "$KIND" = extra ]; then
            files=(.repo-build/set.json)
          else
            files=(.repo-build/set.json .repo-build/set.lock.json .repo-build/render-set.mjs scripts/check-set.mjs README.md llms.txt)
          fi
          git -c core.hooksPath=/dev/null add -- "${files[@]}"
          if [ "$KIND" = extra ]; then
            mode=$(git -c core.hooksPath=/dev/null ls-files --stage -- .repo-build/set.json)
            [[ "$mode" == 100644* || "$mode" == 100755* ]] || { echo 'Extra target set.json must be a regular file' >&2; exit 1; }
            actual=$(git -c core.hooksPath=/dev/null show :.repo-build/set.json | sha256sum | cut -d' ' -f1)
            [ "$actual" = "$EXPECTED_SHA256" ] || { echo 'Extra target set.json is not byte-identical to the validated source' >&2; exit 1; }
          fi
          if git -c core.hooksPath=/dev/null diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Mint repository token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SET_SYNC_APP_ID }}
          private-key: ${{ secrets.SET_SYNC_PRIVATE_KEY }}
          owner: aunysillyme
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit changes
        if: steps.stage.outputs.changed == 'true'
        working-directory: target
        run: |
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync the project set'
      - name: Push changes
        if: steps.stage.outputs.changed == 'true'
        working-directory: target
        env:
          TARGET: ${{ matrix.target }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          export -n APP_TOKEN
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w 0)
          unset APP_TOKEN
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git -c core.hooksPath=/dev/null push --force "https://github.com/$TARGET.git" HEAD:refs/heads/set-sync/update
          unset auth
      - name: Create or update pull request
        if: steps.stage.outputs.changed == 'true'
        id: pr
        env:
          TARGET: ${{ matrix.target }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export -n APP_TOKEN
          cd "$RUNNER_TEMP"
          number=$(GH_TOKEN="$APP_TOKEN" gh pr list --repo "$TARGET" --state open --head set-sync/update --base main --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            GH_TOKEN="$APP_TOKEN" gh pr edit "$number" --repo "$TARGET" --title 'Sync the project set' --body 'Update the shared project set and generated blocks.'
            result='PR updated'
          else
            GH_TOKEN="$APP_TOKEN" gh pr create --repo "$TARGET" --head set-sync/update --base main --title 'Sync the project set' --body 'Update the shared project set and generated blocks.' > /dev/null
            result='PR opened'
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        if: steps.stage.outputs.changed == 'true'
        id: auto
        env:
          TARGET: ${{ matrix.target }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export -n APP_TOKEN
          cd "$RUNNER_TEMP"
          if GH_TOKEN="$APP_TOKEN" gh pr merge set-sync/update --repo "$TARGET" --auto --squash 2> "$RUNNER_TEMP/auto-merge-error"; then
            echo 'result=auto-merge enabled' >> "$GITHUB_OUTPUT"
          else
            reason=$(tr '\n\r' '  ' < "$RUNNER_TEMP/auto-merge-error" | sed 's/|/\\|/g')
            echo "result=auto-merge not enabled: ${reason:-unknown error}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Close stale pull requests and delete branch
        if: steps.stage.outputs.changed == 'false'
        id: cleanup
        env:
          TARGET: ${{ matrix.target }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export -n APP_TOKEN
          cd "$RUNNER_TEMP"
          numbers=$(GH_TOKEN="$APP_TOKEN" gh api --paginate "repos/$TARGET/pulls?state=open&head=aunysillyme:set-sync%2Fupdate&per_page=100" --jq '.[].number')
          while IFS= read -r number; do
            [ -z "$number" ] || GH_TOKEN="$APP_TOKEN" gh pr close "$number" --repo "$TARGET"
          done <<< "$numbers"
          branch=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$TARGET/git/ref/heads/set-sync/update" --jq .ref 2> "$RUNNER_TEMP/branch-error") || {
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/branch-error"; then cat "$RUNNER_TEMP/branch-error" >&2; exit 1; fi
            branch=''
          }
          if [ -n "$branch" ]; then
            GH_TOKEN="$APP_TOKEN" gh api --method DELETE "repos/$TARGET/git/refs/heads/set-sync/update" > /dev/null
          fi
          echo 'result=unchanged; stale PRs closed and branch deleted if present' >> "$GITHUB_OUTPUT"
      - name: Summarize target
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          PR_RESULT: ${{ steps.pr.outputs.result }}
          AUTO_RESULT: ${{ steps.auto.outputs.result }}
          CLEANUP_RESULT: ${{ steps.cleanup.outputs.result }}
        run: |
          result="${CLEANUP_RESULT:-${PR_RESULT:-failed}}"
          if [ -n "$AUTO_RESULT" ]; then result="$result; $AUTO_RESULT"; fi
          printf '| Target | Result |\n| --- | --- |\n| %s | %s |\n' "$TARGET" "$result" >> "$GITHUB_STEP_SUMMARY"
